# -----------------------------------------------------------------------------
# acs-frontend (admin) — CI/CD (Production)
#
# Builds the production image (NEXT_PUBLIC_API_BASE_URL pointing at
# api.communityservices.org.au, the live morpheus backend) and deploys it to
# snswserver as `acs-frontend`, joining the shared nginx-proxy for
# admin.communityservices.org.au — in PARALLEL with the existing Vercel
# deployment, which still owns the live DNS for that name. This target only
# becomes the real site once DNS is manually flipped from Vercel to
# snswserver's public IP (107.155.65.229); until then this is a warm standby,
# reachable only via a Host-header request straight to that IP.
# -----------------------------------------------------------------------------

name: Build and Deploy Docker (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: south-nsw-conference-office/acs-frontend

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Consumed by the deploy job, so both halves reference the same tag by
      # construction rather than by both happening to format it the same way.
      image_tag: ${{ steps.imagetag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A tag unique to this commit.
      #
      # The deploy previously pulled the floating `production` tag. `docker compose
      # up -d` compares the image reference it already has against the one in the
      # compose file, sees the same `:production` string, and can leave the running
      # container in place — so the old build stayed live while every step of the
      # workflow reported success. That is how commit 45e54a0 deployed green and did
      # not reach the site. Referencing a tag that changes each commit removes the
      # ambiguity, and the verification step at the end of the deploy job now fails
      # the run if the container is somehow still on a different image.
      - name: Compute immutable image tag
        id: imagetag
        run: echo "tag=production-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=raw,value=${{ steps.imagetag.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.communityservices.org.au
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max

  deploy:
    name: Deploy to snswserver
    runs-on: ubuntu-latest
    needs: build-and-push
    concurrency:
      group: deploy-acs-frontend-production-snswserver
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 107.155.65.229
          username: snswcomms
          key: ${{ secrets.SNSW_SSH_KEY }}
          source: deploy/docker-compose.snswserver-production.yml
          target: /opt/acs-frontend/

      - name: Pull and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 107.155.65.229
          username: snswcomms
          key: ${{ secrets.SNSW_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/acs-frontend
            mv deploy/docker-compose.snswserver-production.yml docker-compose.yml
            rmdir deploy 2>/dev/null || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Persist IMAGE_TAG so the compose file resolves to this commit's image.
            # docker compose reads .env from the project directory, and without it the
            # ${IMAGE_TAG:-production} default sends us back to the floating tag.
            echo "IMAGE_TAG=$IMAGE_TAG" > .env

            docker compose pull
            docker compose up -d --force-recreate --remove-orphans

            # Assert the container is actually on this commit's image. Without this the
            # job passes whenever the commands merely exit 0, which is exactly how a
            # stale container went unnoticed.
            RUNNING=$(docker inspect --format '{{.Config.Image}}' acs-frontend)
            echo "running image: $RUNNING"
            case "$RUNNING" in
              *"$IMAGE_TAG") echo "OK: serving $IMAGE_TAG" ;;
              *) echo "FAIL: expected $IMAGE_TAG, container is on $RUNNING" >&2; exit 1 ;;
            esac

            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
