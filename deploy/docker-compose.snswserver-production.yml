# =============================================================================
# acs-frontend (admin) — PRODUCTION docker-compose for the **snswserver** host
# (Debian 13, linux/amd64, public IP). Deployed 2026-08-18 in PARALLEL with
# the existing Vercel deployment, while DNS for admin.communityservices.org.au
# still points at Vercel — see project_acs_backend memory. Once DNS is
# manually flipped (CNAME -> A record at 107.155.65.229), this container
# becomes the live site and Vercel can be retired.
# =============================================================================
#
# Lives at /opt/acs-frontend/docker-compose.yml on snswserver. CI scp's this
# file here, then runs `docker compose pull && up -d`. Builds nothing — pulls
# the prebuilt linux/amd64 image from GHCR.
#
# NEXT_PUBLIC_API_BASE_URL is baked into the image at BUILD time (see
# ../Dockerfile / .github/workflows/docker-deploy-production.yml build-args)
# — it is NOT read from this file at runtime. It points at
# https://api.communityservices.org.au, the acs-api-proxy fronting the
# production backend on morpheus.
#
# FRONT DOOR (TLS) — joins snswserver's existing SHARED nginx-proxy +
#   acme-companion stack (owned by /opt/adventistpulse/proxy), rather than
#   terminating its own TLS. acme-companion can only issue a real cert for
#   admin.communityservices.org.au once DNS for that name actually resolves
#   here — until the DNS cutover it will retry and fail quietly, which is
#   expected. Verify readiness in the meantime via a Host-header curl against
#   107.155.65.229 directly, e.g.:
#     curl -H "Host: admin.communityservices.org.au" http://107.155.65.229/
# =============================================================================

services:
  frontend:
    image: ghcr.io/south-nsw-conference-office/acs-frontend:${IMAGE_TAG:-production}
    container_name: acs-frontend
    restart: unless-stopped

    environment:
      - VIRTUAL_HOST=admin.communityservices.org.au
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=admin.communityservices.org.au

    expose:
      - "3000"

    networks:
      - proxy-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  proxy-network:
    external: true
